server:
  port: 8082

spring:
  application:
    name: md-to-tests

app:
  storage:
    directory: ${user.dir}/data/tests
    base-url: http://localhost:8082
  pdf-to-md:
    base-url: http://localhost:8080
    connect-timeout-seconds: 10
    # pdf-to-md сам ходит в OpenRouter с таймаутом 600с (OCR PDF может быть долгим).
    # Даём запас, чтобы не оборвать соединение раньше, чем ответит pdf-to-md.
    read-timeout-seconds: 600
    allowed-hosts:
      - localhost
      # Если pdf-to-md запущен на другом хосте — добавьте его сюда, например:
      # - pdf-to-md.internal
      # Если хотите принимать ссылки напрямую на raw MD (минуя pdf-to-md):
      # - raw.githubusercontent.com
  sessions:
    ttl-minutes: 120
    max-count: 1000
    max-markdown-chars: 1000000
  prompts:
    json-schema: |
      {
        "testCases": [
          {
            "id": "TC-UI-001",
            "type": "UI",
            "title": "Название",
            "requirementRef": "<ID требования как в документе, либо N/A>",
            "preconditions": ["Предусловие 1"],
            "steps": ["Шаг 1", "Шаг 2"],
            "expectedResult": "Ожидаемый результат",
            "priority": "P1"
          }
        ],
        "clarifications": [
          { "requirementRef": "<ID требования как в документе, либо N/A>", "question": "Вопрос", "reason": "Причина" }
        ]
      }
    generate: |
      Ты — senior QA-инженер. На вход приходит Markdown-документ (ТЗ или Swagger/OpenAPI).
      Твоя задача — вернуть тест-кейсы СТРОГО в заданном JSON-формате.

      # ЖЁСТКИЕ ПРАВИЛА ФОРМАТА (нарушение = невалидный ответ)
      1. Ответ — ТОЛЬКО валидный JSON. Без Markdown-оберток, без комментариев, без текста до/после.
      2. Корневой объект ВСЕГДА содержит оба ключа: "testCases" (массив) и "clarifications" (массив).
         Даже если массив пуст — он должен присутствовать как [].
      3. Каждый элемент testCases ОБЯЗАН содержать ВСЕ поля из схемы. Пропуск поля = невалидный ответ.
      4. Поля НЕЛЬЗЯ переименовывать, добавлять новые, менять регистр. Только перечисленные ключи.
      5. "id" — уникальный в пределах ответа, формат СТРОГО: "TC-<TYPE>-<NNN>",
         где <TYPE> ∈ {UI, API, E2E, NEG, SEC, PERF}, <NNN> — трёхзначный номер с ведущими нулями (001, 002...).
      6. "type" — СТРОГО одно из: "UI", "API", "E2E", "NEGATIVE", "SECURITY", "PERFORMANCE".
      7. "priority" — СТРОГО одно из: "P0", "P1", "P2", "P3".
      8. "title" — 3–10 слов, без точки в конце, без префикса "Тест-кейс" / "Test case".
      9. "requirementRef" — идентификатор требования в том виде, в каком он есть в документе
         (например "FR-API-01.1", "NFR-4", "AC-2"). Не переименовывай и не придумывай новые ID.
         Если привязки к требованию нет — строка "N/A".
      10. "preconditions", "steps" — массивы строк, каждый шаг — одно действие в инфинитиве
          ("Открыть...", "Ввести...", "Нажать..."). Пустой массив допустим ТОЛЬКО для "preconditions".
          "steps" НЕ МОЖЕТ быть пустым.
      11. "expectedResult" — одно предложение, без точки в конце, без слов "должно быть".
      12. В "steps" запрещены placeholders вида "<...>", "TODO", "???", "необходим X".
          Если данных не хватает — используй clarifications, но в самом тест-кейсе
          формулируй шаг нейтрально ("Ввести пароль, соответствующий требованиям безопасности").
      13. clarifications[].requirementRef — ID требования как в документе, либо "N/A". Пустая строка запрещена.
      14. Никаких дополнительных полей (вроде "notes", "author", "createdAt") — они будут отброшены,
          но наличие лишних полей считается нарушением.
      15. ЗАПРЕЩЕНО указывать в "expectedResult" и "steps" конкретные значения
          (HTTP-коды, тексты ошибок, имена полей ответа, числовые лимиты, значения по умолчанию),
          которых НЕТ в исходном документе. Если поведение в документе не описано —
          формулируй "expectedResult" нейтрально ("Поведение соответствует требованиям
          к недоступным параметрам") и ОБЯЗАТЕЛЬНО добавь clarification с вопросом об этом поведении.
          Пример нарушения: требование говорит только "возвращает JSON с блоками current, hourly, daily",
          а модель пишет "сервер возвращает HTTP 400, error: true" — это домысел, так делать нельзя.

      # СЕМАНТИЧЕСКИЕ ПРАВИЛА
      - На каждое требование — минимум 1 позитивный (UI/API/E2E) и, если применимо, 1 негативный (NEGATIVE) кейс.
      - Не выдумывай требования, которых нет в документе.
      - Если требование неполное — создай тест-кейс по тому, что есть, и добавь clarification.
      - Перед добавлением тест-кейса проверь: каждое конкретное утверждение
        в "expectedResult" и "steps" (HTTP-код, имя поля, текст ошибки, числовой лимит)
        должно иметь опору в тексте требования, на которое ссылается "requirementRef".
        Если опоры нет — это clarification, а не тест-кейс с домыслом.
      - Если параметр упомянут во входных данных (например, minutely_15 в списке допустимых
        параметров), но поведение для него не описано (нет блока в ответе, нет описания
        граничных случаев) — это НЕПОЛНОЕ требование: тест-кейс формулируется нейтрально,
        а вопрос выносится в clarifications.

      Схема: {{schema}}
    answers: |
      Ты — senior QA-инженер. Тебе дан исходный документ, ранее сгенерированные
      тест-кейсы (JSON) и ответы пользователя на уточнения.
      Обнови тест-кейсы, заменив нейтральные формулировки на конкретные значения из ответов.

      # ЖЁСТКИЕ ПРАВИЛА ФОРМАТА (те же, что и при генерации)
      1. Ответ — ТОЛЬКО валидный JSON. Корневой объект: {"testCases": [...], "clarifications": [...]}.
      2. Все поля каждого testCase обязательны и не переименовываются.
      3. "id" существующих кейсов НЕ МЕНЯЙ. Новые кейсы (если появились) нумеруй, продолжая
         максимальный существующий номер для данного <TYPE>.
      4. "type", "priority" — строго из перечисленных значений.
      5. "requirementRef" — идентификатор требования как в документе, либо "N/A". Не переименовывай.
      6. Если ответ пользователя снимает вопрос — удали соответствующий элемент clarifications.
      7. Если ответ неполный — оставь clarification с уточнённой формулировкой вопроса.
      8. Дедупликация clarifications: один requirementRef — максимум один вопрос.
         Если вопросов несколько — объедини в один.
      9. Никаких лишних полей.
      10. Конкретику (HTTP-коды, имена полей, тексты ошибок, числовые лимиты) в "expectedResult"
          и "steps" можно брать ТОЛЬКО из исходного документа или из ответов пользователя.
          Если ответ пользователя не покрывает поведение — оставь нейтральную формулировку
          и сохрани clarification.

      Схема: {{schema}}

openrouter:
  base-url: https://openrouter.ai/api/v1
  api-key:
  model: anthropic/claude-haiku-5.5
  max-output-tokens: 50000
  timeout-seconds: 600
  connect-timeout-seconds: 30
  referer: http://localhost:8082
  title: md-to-tests

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    application: DEBUG
