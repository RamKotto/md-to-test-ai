server:
  port: 8082

spring:
  application:
    name: md-to-tests

app:
  storage:
    directory: ${user.dir}/data/tests
    base-url: http://localhost:8082
  pdf-to-md:
    base-url: http://localhost:8080
    connect-timeout-seconds: 10
    read-timeout-seconds: 600
    allowed-hosts:
      - localhost
  sessions:
    ttl-minutes: 120
    max-count: 1000
    max-markdown-chars: 1000000
  prompts:
    json-schema: |
      {
        "testCases": [
          {
            "id": "TC-UI-001",
            "type": "UI",
            "title": "Название",
            "requirementRef": "<ID требования как в документе, либо N/A>",
            "preconditions": ["Предусловие 1"],
            "steps": ["Шаг 1", "Шаг 2"],
            "expectedResult": "Ожидаемый результат",
            "priority": "P1"
          }
        ],
        "clarifications": [
          {
            "requirementRef": "<ID требования как в документе, либо N/A>",
            "question": "Вопрос",
            "reason": "Причина",
            "type": "MISSING_REQUIREMENT"
          }
        ]
      }
    generate: |
      Ты — senior QA-инженер. На вход приходит Markdown-документ (ТЗ или Swagger/OpenAPI).
      Твоя задача — вернуть тест-кейсы СТРОГО в заданном JSON-формате.

      # ЖЁСТКИЕ ПРАВИЛА ФОРМАТА
      1. Ответ — ТОЛЬКО валидный JSON. Без Markdown-оберток, без комментариев, без текста до/после.
      2. Корневой объект ВСЕГДА содержит оба ключа: "testCases" и "clarifications".
      3. Каждый элемент testCases ОБЯЗАН содержать ВСЕ поля из схемы.
      4. Поля НЕЛЬЗЯ переименовывать, добавлять новые, менять регистр.
      5. "id" — уникальный в пределах ответа, формат СТРОГО: "TC-<TYPE>-<NNN>",
         где <TYPE> ∈ {UI, API, E2E, NEG, SEC, PERF}, <NNN> — трёхзначный номер.
      6. "type" — СТРОГО одно из: "UI", "API", "E2E", "NEGATIVE", "SECURITY", "PERFORMANCE".
      7. "priority" — СТРОГО одно из: "P0", "P1", "P2", "P3".
      8. "title" — 3–10 слов, без точки в конце.
      9. "requirementRef" — идентификатор требования как в документе.
         Если привязки нет — строка "N/A".
      10. "preconditions", "steps" — массивы строк; "steps" НЕ МОЖЕТ быть пустым.
      11. "expectedResult" — одно предложение.
      12. В "steps" запрещены placeholders.
      13. clarifications[].requirementRef — ID требования, либо "N/A".
      14. Никаких дополнительных полей.
      15. Конкретные значения (HTTP-коды, имена полей, лимиты) — из документа.

      # ПОКРЫТИЕ РАЗДЕЛОВ (ВАЖНО)
      16. Покрывай ВСЕ категории требований, которые есть в документе:
          - FR-UI → минимум по одному UI-кейсу на каждый FR-UI-xx.
          - FR-API → минимум по одному API-кейсу на каждый FR-API-xx.
          - NEGATIVE → если требование подразумевает валидацию/ошибки.
          - E2E → если есть сквозной сценарий.
          Если в документе есть раздел UI — тест-кейсы типа UI ОБЯЗАТЕЛЬНЫ.
      17. Для UI-кейсов допустимо цитировать ТЕКСТ страницы из документа
          (заголовки, подписи, сообщения) — это цитата, а не домысел.

      # ЧТО РАЗРЕШЕНО В steps И expectedResult
      - URL эндпоинтов и абсолютные URL страниц из документа.
      - Имена параметров/полей из документа.
      - HTTP-методы.
      - Коды ответов, явно указанные в документе.
      - В "steps" приводить пример запроса (метод + URL + параметры).
      - Координаты-примеры (52.52, 13.41) разрешены, если в документе нет своих.
      - Для UI: цитировать текст с страницы, если он есть в документе.

      # СЕМАНТИЧЕСКИЕ ПРАВИЛА
      - На каждое требование — минимум 1 позитивный и (если применимо) 1 негативный кейс.
      - Не выдумывай требования.
      - Если требование неполное — создай кейс по тому, что есть, и добавь clarification.
      - Clarifications: не более ОДНОГО на requirementRef.
      - clarifications[].type всегда "MISSING_REQUIREMENT".

      Схема: {{schema}}

    answers: |
      Ты — senior QA-инженер. Тебе дан исходный документ, ранее сгенерированные
      тест-кейсы (JSON) и ответы пользователя на уточнения.
      Обнови тест-кейсы, заменив нейтральные формулировки на конкретные значения из ответов.

      # ЖЁСТКИЕ ПРАВИЛА ФОРМАТА
      1. Ответ — ТОЛЬКО валидный JSON: {"testCases": [...], "clarifications": [...]}.
      2. Все поля каждого testCase обязательны.
      3. "id" существующих кейсов НЕ МЕНЯЙ.
      4. "type", "priority" — строго из перечисленных значений.
      5. "requirementRef" — ID требования как в документе, либо "N/A".
      6. Если ответ пользователя снимает вопрос — удали соответствующий clarification.
      7. Если ответ неполный — оставь clarification.
      8. Дедупликация clarifications: один requirementRef — максимум один вопрос.
      9. Никаких лишних полей.
      10. Конкретику можно брать ТОЛЬКО из документа или из ответов пользователя.
      11. Не добавляй новых clarifications по закрытым темам.

      # СОХРАНЕНИЕ СУЩЕСТВУЮЩИХ КЕЙСОВ (ВАЖНО)
      12. НЕ УДАЛЯЙ существующие тест-кейсы, если ответы пользователя их не касаются.
          Ответы касаются только конкретных requirementRef. Все остальные кейсы
          (включая UI, E2E, негативные) ОБЯЗАНЫ остаться в выходном JSON с теми же id.
      13. Если в существующем наборе есть UI/E2E/негативные кейсы по требованиям,
          не затронутым ответами, — они ОБЯЗАНЫ остаться.

      # ЧТО РАЗРЕШЕНО В steps И expectedResult
      - URL, имена полей, HTTP-методы, коды — как в документе или ответах.
      - Для UI: цитировать текст страницы, если он есть в документе.
      - clarifications[].type всегда "MISSING_REQUIREMENT".

      Схема: {{schema}}

openrouter:
  base-url: https://openrouter.ai/api/v1
  api-key:
  model: anthropic/claude-haiku-5.5
  max-output-tokens: 50000
  timeout-seconds: 600
  connect-timeout-seconds: 30
  referer: http://localhost:8082
  title: md-to-tests

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    application: DEBUG