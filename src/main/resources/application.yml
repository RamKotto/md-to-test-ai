server:
  port: 8082

spring:
  application:
    name: md-to-tests

openrouter:
  base-url: https://openrouter.ai/api/v1
  api-key: ${OPENROUTER_API_KEY:}
  model: openrouter/free
  max-output-tokens: 50000
  timeout-seconds: 600
  referer: http://localhost:8082
  title: md-to-tests

logging:
  level:
    application: INFO